name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Test, race, vet, and lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Verify modules
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test with race detector
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...
      - name: Vet
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.0
      - name: Upload coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.2.0
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: error

  security:
    name: Go security scans
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.6
          cache: true
      - name: Run gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 ./...
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  image:
    name: Build, harden, and scan image
    needs: [go, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADMIN_PASSWORD: integration-test-password
      BROKER_TOKEN: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      DOCKER_GID: "999"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.2.0
        with:
          dockerfile: Dockerfile
      - name: Validate Compose isolation
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.ghcr.yml config --quiet
          test "$(docker compose config --format json | jq '[.services["palworld-starter"].volumes[]? | select(.source == "/var/run/docker.sock")] | length')" = "0"
          test "$(docker compose config --format json | jq '[.services["docker-broker"].volumes[]? | select(.source == "/var/run/docker.sock")] | length')" = "1"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build application image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          load: true
          tags: palworld-starter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify non-root runtime and bundled broker
        run: |
          test "$(docker image inspect palworld-starter:test --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --entrypoint /bin/sh palworld-starter:test -c 'test -x /app/palworld-starter && test -x /app/docker-broker'
      - name: Smoke-test web health
        run: |
          id=$(docker run --detach --rm --publish 127.0.0.1::5000 \
            --env ADMIN_PASSWORD="$ADMIN_PASSWORD" --env BROKER_TOKEN="$BROKER_TOKEN" \
            palworld-starter:test)
          trap 'docker stop "$id" >/dev/null 2>&1 || true' EXIT
          port=$(docker port "$id" 5000/tcp | awk -F: 'NR == 1 {print $NF}')
          for _ in $(seq 1 30); do
            if curl --fail --silent --max-time 2 "http://127.0.0.1:${port}/healthz" >/dev/null; then exit 0; fi
            sleep 1
          done
          docker logs "$id"
          exit 1
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: palworld-starter:test
          version: v0.74.0
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish multi-architecture image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      - name: Build and push
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max
      - name: Attest image provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
